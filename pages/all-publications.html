<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Publications - Your Name</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .publications-page-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .publications-page-title {
            font-size: 24px;
            color: #1a5276;
            margin-bottom: 5px;
            font-weight: bold;
            font-family: 'Crimson Text', serif;
        }
        .pub-card-item {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .pub-card-item:last-child {
            border-bottom: none;
        }
        .pub-card-thumbnail {
            width: 200px;
            height: 150px;
            flex-shrink: 0;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            overflow: hidden;
        }
        .pub-card-thumbnail img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .pub-card-info {
            flex: 1;
        }
        .pub-card-title {
            font-size: 16px;
            font-weight: bold;
            color: #1a5276;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .pub-card-authors {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
        }
        .pub-card-authors strong {
            font-weight: bold;
        }
        .pub-card-venue {
            font-size: 14px;
            color: #555;
            font-style: italic;
            margin-bottom: 10px;
        }
        .pub-card-links {
            display: flex;
            gap: 10px;
        }
        .pub-card-links a {
            font-size: 14px;
            color: #1a5276;
            text-decoration: none;
        }
        .pub-card-links a:hover {
            text-decoration: underline;
        }
        .back-to-home {
            margin-top: 30px;
            text-align: center;
        }
        .back-to-home a {
            color: #1a5276;
            text-decoration: none;
            font-size: 14px;
        }
        .back-to-home a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Top Navigation - Shared Banner -->
    <nav class="top-nav">
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="#" class="active">All Publications</a></li>
        </ul>
    </nav>

    <!-- Content Container -->
    <div class="content-container">
        <!-- Main Content -->
        <div class="main-wrapper">
            <main class="main-content">
                <section id="all-publications" class="section">
                    <div class="publications-page-container">
                        <h1 class="publications-page-title">Publications (* co-first authors)</h1>
                        <div id="publications-list" class="publications-list">
                        </div>

                        <div class="back-to-home">
                            <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="current-year"></span> Your Name. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        var fallbackPublications = [
          {
            "title": "CAT: Enhancing Multimodal Large Language Model to Answer Questions in Dynamic Audio-Visual Scenarios",
            "authors": "<strong>Qilang Ye</strong>, Zitong Yu, Rui Shao, Xinyu Xie, Philip Torr, Xiaochun Cao",
            "venue": "European Conference on Computer Vision (ECCV), 2024.",
            "thumbnail": "../assets/publications/placeholder/paper-thumb.png",
            "tags": [
              { "text": "paper", "link": "#" },
              { "text": "Code", "link": "#" }
            ]
          },
          {
            "title": "CAT+: Investigating and Enhancing Audio-visual Understanding in Large Language Models",
            "authors": "<strong>Qilang Ye</strong>, Zitong Yu, Xin Liu",
            "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence (TPAMI), 2025.3582389",
            "thumbnail": "../assets/publications/placeholder/paper-thumb.png",
            "tags": [
              { "text": "paper", "link": "#" }
            ]
          },
          {
            "title": "Pose-promote: Progressive Visual Perception for Activities of Daily Living",
            "authors": "<strong>Qilang Ye</strong>, Zitong Yu",
            "venue": "IEEE Signal Processing Letters (IEEE SPL)",
            "thumbnail": "../assets/publications/placeholder/paper-thumb.png",
            "tags": [
              { "text": "paper", "link": "#" },
              { "text": "Code", "link": "#" }
            ]
          },
          {
            "title": "3sG: Three-stage Guidance for Indoor Human Action Recognition",
            "authors": "Hai Nan*, <strong>Qilang Ye*</strong>, Zitong Yu, Kang An",
            "venue": "IET Image Processing",
            "thumbnail": "../assets/publications/placeholder/paper-thumb.png",
            "tags": [
              { "text": "paper", "link": "#" },
              { "text": "Code", "link": "#" }
            ]
          },
          {
            "title": "一种基于人体骨架的任意角度坐姿识别方法",
            "authors": "<strong>Qilang Ye</strong>, Hai Nan, Daixin Li",
            "venue": "中文核心",
            "thumbnail": "../assets/publications/placeholder/paper-thumb.png",
            "tags": [
              { "text": "paper", "link": "#" }
            ]
          },
          {
            "title": "Diffusion Boundary: Bridging the Gap between Text-to-Image Diffusion Models and Video Understanding",
            "authors": "<strong>Qilang Ye</strong>, Zitong Yu, et al.",
            "venue": "Under Review",
            "thumbnail": "../assets/publications/placeholder/paper-thumb.png",
            "tags": [
              { "text": "paper", "link": "#" }
            ]
          }
        ];

        function renderPubs(publications) {
            var container = document.getElementById('publications-list');
            container.innerHTML = '';
            publications.forEach(function(pub) {
            var card = document.createElement('div');
            card.className = 'pub-card-item';

            var thumbDiv = document.createElement('div');
            thumbDiv.className = 'pub-card-thumbnail';
            if (pub.thumbnail) {
                var img = document.createElement('img');
                img.src = pub.thumbnail;
                img.alt = pub.title;
                thumbDiv.appendChild(img);
            }
            card.appendChild(thumbDiv);

            var infoDiv = document.createElement('div');
            infoDiv.className = 'pub-card-info';

            var titleDiv = document.createElement('div');
            titleDiv.className = 'pub-card-title';
            titleDiv.textContent = pub.title;
            infoDiv.appendChild(titleDiv);

            var authorsDiv = document.createElement('div');
            authorsDiv.className = 'pub-card-authors';
            authorsDiv.innerHTML = pub.authors;
            infoDiv.appendChild(authorsDiv);

            var venueDiv = document.createElement('div');
            venueDiv.className = 'pub-card-venue';
            venueDiv.textContent = pub.venue;
            infoDiv.appendChild(venueDiv);

            if (pub.tags && pub.tags.length > 0) {
                var linksDiv = document.createElement('div');
                linksDiv.className = 'pub-card-links';
                pub.tags.forEach(function(tag) {
                    var link = document.createElement('a');
                    link.href = tag.link;
                    link.textContent = '[' + tag.text + ']';
                    link.target = '_blank';
                    linksDiv.appendChild(link);
                });
                infoDiv.appendChild(linksDiv);
            }

            card.appendChild(infoDiv);
            container.appendChild(card);
        });
        }

        fetch('../data/publications.json')
            .then(function(response) { return response.json(); })
            .then(function(data) { renderPubs(data); })
            .catch(function() { renderPubs(fallbackPublications); });
    </script>
</body>
</html>
